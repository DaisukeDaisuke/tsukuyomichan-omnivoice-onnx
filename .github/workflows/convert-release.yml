name: Convert full-finetune to FP32 ONNX

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tsukuyomichan-full-finetune-fp32-release
  cancel-in-progress: false

jobs:
  convert-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      HF_REPO_ID: RabbitDaisuke/tsukuyomichan-omnivoice-full-finetune-onnx
    steps:
      - name: Set runner-local build paths
        shell: bash
        run: |
          build_root="$RUNNER_TEMP/tsukuyomichan-omnivoice-onnx-$GITHUB_RUN_ID"
          printf 'BUILD_ROOT=%s\n' "$build_root" >> "$GITHUB_ENV"
          printf 'HF_HOME=%s\n' "$build_root/hf-home" >> "$GITHUB_ENV"
          printf 'RELEASE_DIR=%s\n' "$GITHUB_WORKSPACE/dist" >> "$GITHUB_ENV"
          printf 'SAMPLES_DIR=%s\n' "$GITHUB_WORKSPACE/samples" >> "$GITHUB_ENV"
          printf 'HF_REVISION=gh-%s-%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" >> "$GITHUB_ENV"

      - name: Checkout converter
        uses: actions/checkout@v5

      - name: Require Hugging Face CI token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Repository secret HF_TOKEN is required for the Hugging Face mirror." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pinned build dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-build.txt

      - name: Validate converter source
        run: python -m compileall -q scripts

      - name: Run converter behavioral safety tests
        run: python scripts/self_test.py

      - name: Verify Hugging Face token and mirror repository
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/upload_huggingface.py prepare --repo-id "$HF_REPO_ID"

      - name: Prepare runner-local build directories
        run: |
          rm -rf "$BUILD_ROOT" "$RELEASE_DIR"
          mkdir -p "$BUILD_ROOT" "$RELEASE_DIR"

      - name: Download pinned Tsukuyomichan full-finetune checkpoint
        run: python scripts/download_sources.py full --work-dir "$BUILD_ROOT" --release-dir "$RELEASE_DIR"

      - name: Export and verify FP32 OmniVoice backbone
        run: |
          python scripts/export_fp32.py backbone \
            --source-dir "$BUILD_ROOT/full-finetune" \
            --work-dir "$BUILD_ROOT" \
            --release-dir "$RELEASE_DIR"

      - name: Assert original voice checkpoint was discarded
        run: |
          test ! -e "$BUILD_ROOT/full-finetune/model.safetensors"
          test ! -e "$RELEASE_DIR/model.safetensors"
          if find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.safetensors' -print -quit | grep -q .; then
            echo "Refusing to release a safetensors build input." >&2
            exit 1
          fi

      - name: Download pinned Higgs Audio 2 codec source
        run: python scripts/download_sources.py higgs --work-dir "$BUILD_ROOT" --release-dir "$RELEASE_DIR"

      - name: Export and verify FP32 Higgs decoder
        run: |
          python scripts/export_fp32.py higgs \
            --source-dir "$BUILD_ROOT/base-omnivoice/audio_tokenizer" \
            --work-dir "$BUILD_ROOT" \
            --release-dir "$RELEASE_DIR"
          rm -rf "$BUILD_ROOT/base-omnivoice"

      - name: Include pinned OmniVoice code license
        run: python scripts/fetch_omnivoice_code_license.py --output "$RELEASE_DIR/OMNIVOICE_CODE_LICENSE.txt"

      - name: Include verified Meta Llama 3 license
        run: python scripts/fetch_meta_license.py --output "$RELEASE_DIR/META-LLAMA-3-LICENSE.txt"

      - name: Finalize release manifest, notices, and hashes
        run: |
          python scripts/finalize_release.py \
            --work-dir "$BUILD_ROOT" \
            --release-dir "$RELEASE_DIR" \
            --hf-revision "$HF_REVISION"

      - name: Generate native CPU audio samples
        shell: bash
        run: |
          rm -rf "$SAMPLES_DIR"
          mkdir -p "$SAMPLES_DIR"

          generate_sample() {
            filename="$1"
            text="$2"
            seed="$3"
            language="$4"
            output="$BUILD_ROOT/sample-${filename%.wav}"
            rm -rf "$output"
            python scripts/native-omnivoice-smoke.py \
              --model-dir "$RELEASE_DIR" \
              --output-dir "$output" \
              --text "$text" \
              --language "$language" \
              --speed 1.0 \
              --seed "$seed" \
              --threads "$(nproc)"
            cp "$output/python_native_listen.wav" "$SAMPLES_DIR/$filename"
          }

          generate_sample \
            01_customs_tariff_rejection.wav \
            '税関関税許可局、関税許可を急遽却下' \
            2026081601 \
            ja
          generate_sample \
            02_webassembly_vibe_coding.wav \
            'WebAssemblyをLLMでVibe Coding中' \
            2026081602 \
            ja
          generate_sample \
            03_found_me_waiting.wav \
            'えへへ、見つけてくれたんだ！ずっとここで待ってたんだよ？' \
            2026081603 \
            ja
          generate_sample \
            04_found_me_waiting_English.wav \
            "Hey, you finally made it! How does it feel, looking back at everything we've been through?" \
            2026081604 \
            en

          file "$SAMPLES_DIR"/*.wav
          (cd "$SAMPLES_DIR" && sha256sum *.wav > SAMPLES_SHA256SUMS && sha256sum --check SAMPLES_SHA256SUMS)

      - name: Final release safety gate
        run: |
          if find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.safetensors' -print -quit | grep -q .; then
            echo "Safetensors source checkpoint leaked into release directory." >&2
            exit 1
          fi
          while IFS= read -r -d '' file; do
            size=$(stat -c '%s' "$file")
            if [ "$size" -gt 1800000000 ]; then
              echo "Release asset exceeds 1.8 GB: $file ($size)" >&2
              exit 1
            fi
          done < <(find "$RELEASE_DIR" -maxdepth 1 -type f -print0)
          (cd "$RELEASE_DIR" && sha256sum --check SHA256SUMS)
          du -h "$RELEASE_DIR"/*

      - name: Mirror verified runtime to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/upload_huggingface.py publish \
            --release-dir "$RELEASE_DIR" \
            --samples-dir "$SAMPLES_DIR" \
            --repo-id "$HF_REPO_ID" \
            --revision "$HF_REVISION" \
            --github-sha "$GITHUB_SHA" \
            --github-run-number "$GITHUB_RUN_NUMBER"

      - name: Update latest FP32 runtime release
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: ${{ github.workspace }}/dist/*,${{ github.workspace }}/samples/*
          artifactErrorsFailBuild: true
          bodyFile: ${{ github.workspace }}/dist/RELEASE_NOTES.md
          makeLatest: true
          name: Higgs Audio 2 Tsukuyomichan OmniVoice ONNX FP32 - Latest (Build ${{ github.run_number }})
          tag: full-finetune-latest
          commit: ${{ github.sha }}
          allowUpdates: true
          removeArtifacts: true
          prerelease: false

      - name: Remove runner-local source checkpoints
        if: always()
        run: rm -rf "$BUILD_ROOT"